mutation createChecklistFromTemplates($templateIds: [ID!]!, $name: String) {
  checklistMutations {
    createChecklistFromTemplates(templateIds: $templateIds, name: $name) {
      message
      entry {
        id
        name
        dueAt
        completedAt
        status
        createdAt
        updatedAt
      }
    }
  }
}
