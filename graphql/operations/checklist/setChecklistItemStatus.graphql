mutation setChecklistItemStatus($entryId: ID!, $itemId: ID!, $status: ItemStatus!) {
  checklistMutations {
    setItemStatus(entryId: $entryId, itemId: $itemId, status: $status) {
      message
      entry {
        id
        name
        dueAt
        completedAt
        status
        createdAt
        updatedAt
      }
    }
  }
}
