query listChecklistTemplateItems($templateId: ID!, $pagination: PaginationInput) {
  checklistQueries {
    templateItems(templateId: $templateId, pagination: $pagination) {
      items {
        id
        templateId
        itemId
        name
        icon
        position
      }
      pageInfo {
        page
        size
        totalPages
        totalCount
        hasNextPage
        hasPreviousPage
      }
    }
  }
}
