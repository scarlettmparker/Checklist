query listChecklistEntryItems($entryId: ID!, $pagination: PaginationInput) {
  checklistQueries {
    entryItems(entryId: $entryId, pagination: $pagination) {
      items {
        id
        entryId
        itemId
        name
        icon
        status
        position
      }
      pageInfo {
        page
        size
        totalPages
        totalCount
        hasNextPage
        hasPreviousPage
      }
    }
  }
}
