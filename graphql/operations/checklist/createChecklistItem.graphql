mutation createChecklistItem($name: String!, $description: String, $categoryId: ID, $icon: String) {
  checklistMutations {
    createItem(name: $name, description: $description, categoryId: $categoryId, icon: $icon) {
      message
      item {
        id
        name
        description
        icon
        categoryId
        lifecycleStatus
        createdAt
        updatedAt
      }
    }
  }
}
