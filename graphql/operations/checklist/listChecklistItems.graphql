query listChecklistItems($pagination: PaginationInput) {
  checklistQueries {
    items(pagination: $pagination) {
      items {
        id
        name
        description
        icon
        categoryId
        lifecycleStatus
        createdAt
        updatedAt
      }
      pageInfo {
        page
        size
        totalPages
        totalCount
        hasNextPage
        hasPreviousPage
      }
    }
  }
}
